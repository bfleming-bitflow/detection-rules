title: Certutil Used to Download a File From a URL
id: 9f476719-13cd-44c4-a687-cf39cb7f991c
status: experimental
description: |
  Detects certutil.exe invoked with -urlcache or -verifyctl together with an HTTP or HTTPS URL.
  Both verbs retrieve remote content and can write it to disk, which makes certutil a built-in
  alternative to dedicated download tools.
references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
  - https://attack.mitre.org/techniques/T1105/
author: bfleming-bitflow
date: 2026-10-09
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_verb:
    CommandLine|contains|windash:
      - ' -urlcache '
      - ' -verifyctl '
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - Administrators retrieving certificate revocation lists or certificates for
    troubleshooting. These normally target known PKI hosts, which can be excluded by URL.
level: high
