title: Windows Event Log Cleared With Wevtutil
id: 00d9e2bd-123f-4236-8d98-06185068a6e2
status: experimental
description: |
  Detects wevtutil.exe clearing an event log with the cl or clear-log command. Clearing logs
  removes evidence of prior activity. Event ID 1102 (Security log cleared) and Event ID 104
  (System log cleared) provide complementary coverage when process creation logging is absent.
references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
  - https://attack.mitre.org/techniques/T1685/005/
author: bfleming-bitflow
date: 2026-10-09
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\wevtutil.exe'
    - OriginalFileName: 'wevtutil.exe'
  selection_cli:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  condition: all of selection_*
falsepositives:
  - Lab or kiosk systems that clear logs on a schedule. Exclude by host after review.
level: high
